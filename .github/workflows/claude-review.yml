# AI review on every PR (the "every PR gets an AI review" practice).
#
# Option A: this workflow. Needs a repo secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN,
#           passed as claude_code_oauth_token instead).
# Option B: managed Code Review via the Claude GitHub App — no workflow file. If you use it,
#           delete this file. https://code.claude.com/docs/en/code-review
#
# The review is advisory. It is NOT a required check: an LLM judge may add friction, never
# turn a gate green. verify (ci.yml) is the required check.

name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
