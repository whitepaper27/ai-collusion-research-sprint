[project]
name = "agent-world-l3"
version = "0.1.0"
description = "Coordination-evidence harness for synthetic finance agents (see sol.md v5.2)."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3.0",
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.15",
]

[project.scripts]
ethwall = "ethwall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ethwall"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: slow end-to-end tests, skipped by verify.sh --fast"]
