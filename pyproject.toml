[project]
name = "agent-world-l3"
version = "0.1.0"
description = "Agent kit + research workspace for the ethical-wall study (see sol.md)."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.15",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: slow end-to-end tests, skipped by verify.sh --fast"]
